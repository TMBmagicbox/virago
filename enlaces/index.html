<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virago Beauty Space — Enlaces</title>
<meta name="description" content="Todos los enlaces de Virago Beauty Space: sitio web, WhatsApp y redes sociales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ciruela:#4A2E3D;
    --rosa-malva:#B98089;
    --rosa-terracota:#9C5D62;
    --lila-humo:#8E7C93;
    --piedra:#A79C8C;
    --hueso:#E4DFD5;
    --marfil:#F4EEE4;
    --carbon:#221F1C;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--marfil);
    color:var(--carbon);
    display:flex;
    justify-content:center;
  }
  .page{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--marfil);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .banner{
    position:relative;
    width:100%;
    height:34vh;
    min-height:220px;
    max-height:320px;
    overflow:hidden;
  }
  .banner img{
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 20%;
    display:block;
  }
  .banner::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom, rgba(34,31,28,0) 55%, var(--marfil) 100%);
  }
  .profile{
    margin-top:-38px;
    z-index:2;
    width:76px;
    height:76px;
    border-radius:50%;
    background:var(--marfil);
    border:4px solid var(--marfil);
    box-shadow:0 4px 18px rgba(34,31,28,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .profile img{
    width:40px;
    height:40px;
    object-fit:contain;
  }
  .name{
    font-family:'Bodoni Moda',serif;
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:0.04em;
    margin-top:14px;
    color:var(--ciruela);
    text-transform:uppercase;
  }
  .tagline{
    font-size:0.82rem;
    color:var(--rosa-terracota);
    letter-spacing:0.02em;
    margin-top:4px;
    text-align:center;
    padding:0 24px;
  }
  .links{
    width:100%;
    padding:28px 24px 8px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:16px 20px;
    background:var(--ciruela);
    color:var(--marfil);
    text-decoration:none;
    border-radius:999px;
    font-weight:500;
    font-size:0.98rem;
    box-shadow:0 3px 10px rgba(74,46,61,0.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .link-btn:active{transform:scale(0.98);}
  .link-btn.secondary{
    background:transparent;
    color:var(--ciruela);
    border:1.5px solid var(--ciruela);
    box-shadow:none;
  }
  .link-btn .ico{
    flex:0 0 22px;
    width:22px;
    height:22px;
  }
  .link-btn span{flex:1;}
  .link-btn .arrow{flex:0 0 auto;opacity:0.7;}

  .redes{
    width:100%;
    padding:22px 24px 8px;
    text-align:center;
  }
  .redes h2{
    font-family:'Bodoni Moda',serif;
    font-weight:600;
    font-size:1rem;
    color:var(--ciruela);
    margin-bottom:16px;
    letter-spacing:0.03em;
  }
  .social-row{
    display:flex;
    justify-content:center;
    gap:18px;
  }
  .social-row a{
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--hueso);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ciruela);
    transition:background .15s ease;
  }
  .social-row a:active{background:var(--piedra);}
  .social-row svg{width:24px;height:24px;}

  footer{
    margin-top:auto;
    width:100%;
    padding:36px 24px 26px;
    text-align:center;
  }
  footer p{
    font-size:0.72rem;
    color:var(--piedra);
    letter-spacing:0.02em;
  }
  footer a{
    color:var(--rosa-terracota);
    text-decoration:none;
  }
</style>
</head>
